<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Dashboard - ArtVerse</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <nav class="navbar">

        <h2>🎨 ArtVerse Admin</h2>

        <div class="nav-links">

            <a href="admin-dashboard.html">
                Dashboard
            </a>

            <a href="gallery.html">
                Gallery
            </a>

            <button
                onclick="logout()"
                class="logout-btn"
            >
                Logout
            </button>

        </div>

    </nav>


    <section class="admin-section">

        <h1>Admin Dashboard 👨‍💼</h1>

        <p>
            Manage users, artists and artworks.
        </p>


        <div class="dashboard-cards">

            <div class="dashboard-card">

                <h2>👤 Users</h2>

                <h3 id="userCount">
                    0
                </h3>

            </div>


            <div class="dashboard-card">

                <h2>🎨 Artists</h2>

                <h3 id="artistCount">
                    0
                </h3>

            </div>


            <div class="dashboard-card">

                <h2>🖼️ Artworks</h2>

                <h3 id="artworkCount">
                    0
                </h3>

            </div>

        </div>


        <h2 class="manage-title">
            All Artworks
        </h2>


        <div
            id="adminArtworkContainer"
            class="gallery-grid"
        ></div>

    </section>


    <script src="js/admin.js"></script>

</body>

</html>
