<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - ArtVerse</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="form-container">

        <div class="form-box">

            <h1>🎨 ArtVerse</h1>

            <h2>Welcome Back</h2>

            <form id="loginForm">

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    required
                >

                <button
                    type="submit"
                    class="btn"
                >
                    Login
                </button>

            </form>

            <p id="loginMessage"></p>

            <p>
                Don't have an account?
                <a href="signup.html">Create Account</a>
            </p>

        </div>

    </div>

    <script src="js/auth.js"></script>

</body>

</html>
