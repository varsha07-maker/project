<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Gallery - ArtVerse</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <nav class="navbar">

        <h2>🎨 ArtVerse</h2>

        <div class="nav-links">

            <a href="index.html">Home</a>

            <a href="gallery.html">Gallery</a>

            <a href="login.html">Login</a>

        </div>

    </nav>


    <section class="gallery-section">

        <h1>Our Art Gallery 🎨</h1>

        <p>
            Explore beautiful artwork from ArtVerse artists.
        </p>


        <input
            type="text"
            id="searchInput"
            class="search-box"
            placeholder="Search artwork..."
        >


        <div
            id="galleryContainer"
            class="gallery-grid"
        ></div>

    </section>


    <script>

        // Get artworks

        let artworks =
            JSON.parse(
                localStorage.getItem("artworks")
            ) || [];


        const container =
            document.getElementById(
                "galleryContainer"
            );


        function displayArtworks(list) {

            container.innerHTML = "";


            if (list.length === 0) {

                container.innerHTML =
                    "<p>No artworks available.</p>";

                return;
            }


            list.forEach(function(art) {

                const card =
                    document.createElement("div");

                card.className =
                    "art-card";


                card.innerHTML = `

                    <img
                        src="${art.image}"
                        alt="${art.title}"
                    >

                    <div class="art-info">

                        <h3>
                            ${art.title}
                        </h3>

                        <p>
                            ${art.description}
                        </p>

                        <h4>
                            ₹${art.price}
                        </h4>

                        <small>
                            Artist: ${art.artist}
                        </small>

                    </div>

                `;


                container.appendChild(card);

            });

        }


        // Display artworks

        displayArtworks(artworks);


        // Search

        document
            .getElementById("searchInput")
            .addEventListener("input", function() {

                const search =
                    this.value.toLowerCase();


                const filtered =
                    artworks.filter(function(art) {

                        return art.title
                            .toLowerCase()
                            .includes(search);

                    });


                displayArtworks(filtered);

            });

    </script>


</body>

</html>
